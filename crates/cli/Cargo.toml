[package]
name = "foil-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Foil AI-First Native Presentation Engine and Player"

[[bin]]
name = "foil"
path = "src/main.rs"

[package.metadata.deb]
name = "foil"
maintainer = "Damião Junior Terto <francisco.damiao.dev@gmail.com>"
copyright = "2026, Damião Junior Terto"
depends = "$auto, libwebkit2gtk-4.1-0, libgtk-3-0"
section = "utils"
priority = "optional"
assets = [
    ["target/release/foil", "usr/bin/", "755"],
    ["../../assets/icons/foil-icon-32.png", "usr/share/icons/hicolor/32x32/apps/foil.png", "644"],
    ["../../assets/icons/foil-icon-64.png", "usr/share/icons/hicolor/64x64/apps/foil.png", "644"],
    ["../../assets/icons/foil-icon-128.png", "usr/share/icons/hicolor/128x128/apps/foil.png", "644"],
    ["../../assets/icons/foil-icon-256.png", "usr/share/icons/hicolor/256x256/apps/foil.png", "644"],
    ["../../assets/icons/foil-icon-512.png", "usr/share/icons/hicolor/512x512/apps/foil.png", "644"],
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
foil-mcp-server = { path = "../mcp-server" }
foil-packager = { path = "../packager" }
foil-player = { path = "../player" }
include_dir = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.14"
